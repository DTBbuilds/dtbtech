<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Primary Meta Tags -->
    <title>Help &amp; Support | DTB Technologies</title>
    <meta name="title" content="Help &amp; Support | DTB Technologies">
    <meta name="description" content="Get IT help and support from DTB Technologies. Chat with DTB TechBot or reach our support team by phone, WhatsApp or email — for clients in Australia and Kenya.">
<meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="author" content="DTB Technologies">
<!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dtbtech.org/help">
    <meta property="og:title" content="Help &amp; Support | DTB Technologies">
    <meta property="og:description" content="Get IT help and support from DTB Technologies. Chat with DTB TechBot or reach our support team by phone, WhatsApp or email — for clients in Australia and Kenya.">
    <meta property="og:image" content="https://dtbtech.org/assets/og/default.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://dtbtech.org/help">
    <meta property="twitter:title" content="Help &amp; Support | DTB Technologies">
    <meta property="twitter:description" content="Get IT help and support from DTB Technologies. Chat with DTB TechBot or reach our support team by phone, WhatsApp or email — for clients in Australia and Kenya.">
    <meta property="twitter:image" content="https://dtbtech.org/assets/og/default.jpg">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://dtbtech.org/help">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Stylesheets and Scripts -->
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/mobile-optimizations.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script src="./components/nav-header.js" defer></script>
    <script src="./components/site-footer.js" defer></script>
</head>
<body class="bg-slate-900 flex flex-col min-h-screen">
    <!-- Navigation -->
    <nav-header></nav-header>

    <!-- Main Content -->
    <main class="flex-grow">
        <!-- Enhanced Hero Section -->
        <section class="relative py-24 overflow-hidden min-h-[40vh] bg-slate-950">
            <div class="absolute inset-0 bg-blue-950/20"></div>
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                <div class="max-w-3xl mx-auto text-center animate-slide-up px-2">
                    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-8 text-white">Help & <span class="text-blue-400">Support</span></h1>
                    <p class="text-xl md:text-2xl text-slate-300 mb-10">Get IT help, FAQs, and support from DTB Technologies.</p>
                </div>
            </div>
        </section>
        <div class="container mx-auto px-4 py-8">
            <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-800">DTB TechBot</h2>
                    <a href="contact" class="text-gray-500 hover:text-gray-700 transition-colors">
                        <i class="fas fa-times text-2xl"></i>
                    </a>
                </div>
                
                <p class="text-gray-600 mb-6">Our assistant is here to help with your technical queries.</p>
                
                <div id="chat-container" class="h-[60vh] bg-gray-50 rounded-lg p-4 mb-4 overflow-y-auto border">
                    <div class="space-y-4">
                        <div class="flex items-start">
                            <div class="bg-blue-100 rounded-lg p-3 max-w-[80%]">
                                <p class="text-gray-800"><strong class="text-blue-600">TechBot:</strong> Hello! How can DTB Technologies assist you today?</p>
                            </div>
                        </div>
                    </div>
                </div>

                <form id="chat-form" class="flex flex-col md:flex-row gap-3">
                    <input 
                        type="text" 
                        id="chat-input" 
                        placeholder="Type your message..." 
                        class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                    <button 
                        type="submit" 
                        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2"
                    >
                        <span>Send</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>

                <!-- Quick Actions -->
                <div class="mt-8">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Quick Actions</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <a href="tel:+61450275013" class="flex items-center gap-3 p-4 bg-green-50 rounded-lg hover:bg-green-100 text-blue-700 font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400" role="button" aria-label="Call DTB Technologies">
                            <i class="fas fa-phone text-green-600"></i>
                            <span class="text-gray-800">Call Support</span>
                        </a>
                        <a href="https://wa.me/61450275013" target="_blank" rel="noopener" class="flex items-center gap-3 p-4 bg-green-50 rounded-lg hover:bg-green-100 transition-colors">
                            <i class="fab fa-whatsapp text-green-600"></i>
                            <span class="text-gray-800">WhatsApp</span>
                        </a>
                        <a href="mailto:dtbbuildsoffice@gmail.com" class="flex items-center gap-3 p-4 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors">
                            <i class="fas fa-envelope text-blue-600"></i>
                            <span class="text-gray-800">Email Us</span>
                        </a>
                        <a href="contact" class="flex items-center gap-3 p-4 bg-blue-50 rounded-lg hover:bg-blue-100 transition-colors">
                            <i class="fas fa-comments text-blue-600"></i>
                            <span class="text-gray-800">Contact Page</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <site-footer></site-footer>

    <script>

        // Chat functionality
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatContainer = document.getElementById('chat-container');

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const message = chatInput.value.trim();
            if (message) {
                // Add user message
                addMessage('You', message, 'justify-end');
                chatInput.value = '';
                
                // Simulate bot response
                setTimeout(() => {
                    addMessage('TechBot', 'Thank you for your message. Our team will get back to you shortly.', 'justify-start');
                }, 1000);
            }
        });

        function addMessage(sender, text, justify) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${justify}`;
            messageDiv.innerHTML = `
                <div class="${sender === 'You' ? 'bg-blue-500 text-white' : 'bg-blue-100 text-gray-800'} rounded-lg p-3 max-w-[80%]">
                    <p><strong class="${sender === 'You' ? 'text-white' : 'text-blue-600'}">${sender}:</strong> ${text}</p>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
